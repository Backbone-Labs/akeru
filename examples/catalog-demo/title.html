<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit study — original input fixture</title>
    <link rel="stylesheet" href="title.css" />
    <script type="module" src="title.js"></script>
  </head>
  <body>
    <main>
      <p class="label">ORIGINAL INPUT STUDY / 001</p>
      <h1>Find a little space.</h1>
      <p class="hint">
        Move the light with your controller or the touch controls below.
      </p>
      <div
        class="field"
        id="field"
        role="img"
        aria-label="An orbiting light that responds to directional input"
      >
        <div class="ring one"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>
        <div id="orb"></div>
      </div>
      <p id="status" role="status" aria-label="Game status">
        Waiting for the trusted shell.
      </p>
      <p
        class="footnote"
        id="save-status"
        role="status"
        aria-label="Save status"
      >
        Checking local saves…
      </p>
    </main>
  </body>
</html>
