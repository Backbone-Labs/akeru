<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>racer</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <header>
      <div>
        <strong>Retro Road Racer</strong>
        <div id="status">Loading game…</div>
      </div>
      <div id="hud">
        <span><b id="speed_value">0</b> mph</span
        ><span id="current_lap_time"
          ><b id="current_lap_time_value">0</b> s</span
        ><span id="last_lap_time">Last <b id="last_lap_time_value">—</b></span
        ><span id="fast_lap_time">Best <b id="fast_lap_time_value">—</b></span>
      </div>
    </header>
    <div id="overlay"></div>
    <div class="controls">
      <div>
        <button data-hold="left" aria-label="Steer left">◀</button
        ><button data-hold="right" aria-label="Steer right">▶</button>
      </div>
      <div>
        <button data-action="restart">Restart</button
        ><button data-hold="up">Accelerate</button
        ><button data-hold="down">Brake</button>
      </div>
    </div>
    <div id="save-status" role="status"></div>
    <script src="engine.js"></script>
    <script type="module" src="title.js"></script>
  </body>
</html>
