<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Brawler Co-op</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas" tabindex="0" aria-label="Brawler game"></canvas>
    <aside id="rotate" hidden aria-label="Rotate your phone">
      <span aria-hidden="true" class="rotate-symbol">↻</span>
      <h1>TAKE IT SIDEWAYS.</h1>
      <p>Turn your phone to landscape to play Brawler.</p>
      <small>In co-op, your friends keep playing while you turn.</small>
    </aside>
    <p id="status" role="status">Loading Brawler…</p>
    <script type="module" src="title.js"></script>
  </body>
</html>
