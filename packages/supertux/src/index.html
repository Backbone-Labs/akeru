<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>supertux</title
  ><link rel="stylesheet" href="style.css" />
  <body data-game="supertux">
    <main id="stage"><canvas tabindex="0" id="canvas"></canvas></main>
    <p id="status">Loading original game…</p>
    <p id="save-status" role="status"></p>
    <nav aria-label="Touch controls">
      <button data-hold="left">Left</button
      ><button data-hold="right">Right</button><button data-hold="up">Up</button
      ><button data-hold="down">Down</button
      ><button data-hold="confirm">Jump</button
      ><button data-hold="cancel">Action</button
      ><button data-hold="menu">Menu</button>
    </nav>
    <script type="module" src="runtime.js"></script>
  </body>
</html>
